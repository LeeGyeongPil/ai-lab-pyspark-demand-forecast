[project]
name = "ai-lab-pyspark-demand-forecast"
version = "0.1.0"
description = "Learn demand forecasting with PySpark: lag features, leakage, seasonal-naive baseline and WAPE (series 3/5)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyspark==4.3.0",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "numpy>=1.23.2",
]

[project.scripts]
demand-forecast = "demand_forecast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
